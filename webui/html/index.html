<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kotoco</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem}
textarea{width:100%;height:9rem;font-size:1rem;padding:.5rem;box-sizing:border-box}
.row{display:flex;gap:.75rem;margin:.75rem 0;flex-wrap:wrap;align-items:center}
button{font-size:1rem;padding:.5rem 1.2rem}
#st{color:#666;font-size:.9rem}
</style></head><body>
<h1>kotoco</h1>
<textarea id="t">こんにちは。Kokoroで音声合成を試しています。</textarea>
<div class="row">
 <label>言語 <select id="l"><option value="j">日本語</option><option value="a">English</option></select></label>
 <label>声 <select id="v"></select></label>
 <label>速度 <input id="s" type="range" min="0.6" max="1.5" step="0.1" value="1"> <span id="sv">1.0</span></label>
</div>
<div class="row"><label>形式 <select id="f"><option>wav</option><option>mp3</option></select></label> <a id="dl" download style="display:none">ダウンロード</a></div>
<div class="row"><button id="go">読み上げ</button><span id="st"></span></div>
<audio id="a" controls style="width:100%"></audio>
<script>
const $=id=>document.getElementById(id);let V={};
async function init(){V=await (await fetch('/api/voices')).json();fill()}
function fill(){$('v').innerHTML=V[$('l').value].map(x=>`<option>${x}</option>`).join('')}
$('l').onchange=()=>{fill();$('t').value=$('l').value==='j'?'こんにちは。Kokoroで音声合成を試しています。':'Hello, this is a test of Kokoro text to speech.'};
$('s').oninput=()=>$('sv').textContent=(+$('s').value).toFixed(1);
$('go').onclick=async()=>{
 $('go').disabled=true;$('st').textContent='生成中…(初回はモデルDLあり)';const t0=performance.now();
 try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({text:$('t').value,lang:$('l').value,voice:$('v').value,speed:+$('s').value,format:$('f').value})});
  if(!r.ok)throw new Error(await r.text());
  const b=await r.blob();const u=URL.createObjectURL(b);$('a').src=u;$('dl').href=u;$('dl').download='kotoco.'+$('f').value;$('dl').style.display='';$('a').play();
  $('st').textContent=`完了 ${((performance.now()-t0)/1000).toFixed(1)}秒`;
 }catch(e){$('st').textContent='エラー: '+e.message}
 $('go').disabled=false};
init();
</script></body></html>
