services:
  api:
    build: ./api
    container_name: kotoco-api
    ports:
      - "127.0.0.1:8896:8000"   # API / Swagger UI (ローカルのみ): http://localhost:8896/docs。外部へは webui の /api/ 経由
    volumes:
      - ./cache:/cache
      - ./data:/data
    restart: unless-stopped

  webui:
    build: ./webui
    container_name: kotoco-webui
    ports:
      - "8895:80"     # WebUI: http://localhost:8895
    depends_on:
      - api
    restart: unless-stopped
